<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>瑞典地理課本（網站版）</title>
    <meta name="description" content="瑞典地理課本（台灣讀者向）網站版：章節可直接在站內閱讀" />
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Heiti TC", Arial, sans-serif;
        margin: 0;
        line-height: 1.65;
      }

      .layout {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        min-height: 100dvh;
      }

      aside {
        border-right: 1px solid rgba(127,127,127,.25);
        padding: 18px 14px 18px 16px;
        position: sticky;
        top: 0;
        height: 100dvh;
        overflow: auto;
      }

      main {
        min-width: 0;
        padding: 26px 22px 60px;
      }

      .brand h1 { margin: 0; font-size: 18px; }
      .brand .sub { margin: 6px 0 12px; opacity: .8; font-size: 13px; }

      .nav-section { margin-top: 14px; }
      .nav-section-title { font-weight: 700; font-size: 13px; opacity: .9; margin: 10px 0 8px; }
      .nav { list-style: none; padding: 0; margin: 0; }
      .nav li { margin: 2px 0; }
      .nav a {
        display: block;
        padding: 8px 10px;
        border-radius: 10px;
        text-decoration: none;
        border: 1px solid transparent;
      }
      .nav a:hover { border-color: rgba(127,127,127,.25); }
      .nav a[aria-current="page"] { border-color: rgba(127,127,127,.45); background: rgba(127,127,127,.10); }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .topbar .path { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; opacity: .8; font-size: 13px; }
      .topbar .actions { display: flex; gap: 10px; flex-wrap: wrap; }
      .btn {
        border: 1px solid rgba(127,127,127,.35);
        background: transparent;
        color: inherit;
        padding: 6px 10px;
        border-radius: 10px;
        font-size: 13px;
        cursor: pointer;
        text-decoration: none;
      }
      .btn:hover { border-color: rgba(127,127,127,.55); }

      .content {
        max-width: 980px;
        margin: 0 auto;
      }

      /* Markdown-ish */
      .md h1 { font-size: 30px; margin: 10px 0 12px; }
      .md h2 { font-size: 22px; margin: 22px 0 10px; }
      .md h3 { font-size: 18px; margin: 18px 0 8px; }
      .md h4 { font-size: 16px; margin: 14px 0 6px; }
      .md p { margin: 10px 0; }
      .md blockquote { margin: 12px 0; padding: 8px 12px; border-left: 3px solid rgba(127,127,127,.5); opacity: .95; }
      .md code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .md pre { padding: 12px 14px; overflow: auto; border-radius: 12px; border: 1px solid rgba(127,127,127,.25); }
      .md img { max-width: 100%; height: auto; }

      .hint { opacity: .8; font-size: 13px; margin-top: 10px; }
      .error { border: 1px solid rgba(255,0,0,.35); padding: 12px 14px; border-radius: 12px; }

      @media (max-width: 880px) {
        .layout { grid-template-columns: 1fr; }
        aside { position: relative; height: auto; }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside>
        <div class="brand">
          <h1>瑞典地理課本（網站版）</h1>
          <div class="sub">點左側章節即可在站內閱讀。</div>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">主稿</div>
          <ul class="nav" id="nav-main"></ul>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">章節</div>
          <ul class="nav" id="nav-chapters"></ul>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">其他</div>
          <ul class="nav" id="nav-other"></ul>
        </div>

        <div class="hint">
          原始檔案都在 <code>manuscript/</code>。若遇到圖片路徑問題，我可以再幫你調整渲染規則。
        </div>
      </aside>

      <main>
        <div class="content">
          <div class="topbar">
            <div class="path" id="current-path">—</div>
            <div class="actions">
              <a class="btn" id="btn-open-raw" href="#" target="_blank" rel="noopener noreferrer">開啟原始 Markdown</a>
              <a class="btn" href="https://github.com/joshra/sweden-geography-textbook" target="_blank" rel="noopener noreferrer">GitHub Repo</a>
            </div>
          </div>

          <article class="md" id="md"></article>
          <div class="hint" id="footer-hint"></div>
        </div>
      </main>
    </div>

    <!-- Markdown renderer (no build needed) -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script>
      const ROUTES = [
        { group: "main", label: "瑞典地理課本_主稿", path: "manuscript/瑞典地理課本_主稿.md" },
        { group: "main", label: "瑞典地理課本_主稿_彙整版", path: "manuscript/瑞典地理課本_主稿_彙整版.md" },

        { group: "chapters", label: "01-瑞典在哪裡｜區域概念與尺度", path: "manuscript/chapters/01-瑞典在哪裡_區域概念與尺度.md" },
        { group: "chapters", label: "02-自然舞台（骨架）", path: "manuscript/chapters/02-自然舞台_地形水系冰河地形與資源_骨架.md" },
        { group: "chapters", label: "03-氣候與環境（骨架）", path: "manuscript/chapters/03-氣候與環境_高緯度海洋性森林帶與極地變遷_骨架.md" },
        { group: "chapters", label: "04-人口與文化（骨架）", path: "manuscript/chapters/04-人口與文化_語言族群移民與城市生活_骨架.md" },
        { group: "chapters", label: "05-經濟與產業（骨架）", path: "manuscript/chapters/05-經濟與產業_林業製造創新服務業與貿易_骨架.md" },
        { group: "chapters", label: "06-城市與區域（骨架）", path: "manuscript/chapters/06-城市與區域_斯德哥爾摩都市圈_西岸工業走廊_南瑞典跨境_骨架.md" },
        { group: "chapters", label: "07-政策與議題（骨架）", path: "manuscript/chapters/07-政策與議題_能源轉型社會福利永續與不平等_骨架.md" },
        { group: "chapters", label: "08-北歐比較與台灣對照（骨架）", path: "manuscript/chapters/08-北歐比較與台灣對照_同與不同可借鏡與限制_骨架.md" },

        { group: "other", label: "名詞表", path: "manuscript/瑞典地理課本_名詞表.md" },
        { group: "other", label: "圖表與資料需求清單", path: "manuscript/瑞典地理課本_圖表與資料需求清單.md" },
      ];

      const DEFAULT_PATH = "manuscript/瑞典地理課本_主稿.md";

      const $ = (sel) => document.querySelector(sel);
      const navMain = $("#nav-main");
      const navChapters = $("#nav-chapters");
      const navOther = $("#nav-other");
      const mdEl = $("#md");
      const currentPathEl = $("#current-path");
      const btnOpenRaw = $("#btn-open-raw");
      const footerHint = $("#footer-hint");

      function encodePath(path) {
        // Encode each path segment to support Chinese filenames
        return path.split("/").map(encodeURIComponent).join("/");
      }

      function routeFromHash() {
        const h = location.hash || "";
        // Support: #/manuscript/xxx.md  or  #manuscript/xxx.md
        const trimmed = h.replace(/^#\/?/, "");
        if (!trimmed) return DEFAULT_PATH;
        // location.hash 會保留百分比編碼（例如中文檔名會變 %E7...），要先解碼避免之後再 encode 時雙重編碼
        try {
          return decodeURIComponent(trimmed);
        } catch {
          // 若 hash 不是合法編碼字串，回退到原值（仍可讀英文路徑）
          return trimmed;
        }
      }

      function setHashToPath(path) {
        location.hash = "#/" + path;
      }

      function isRelativeUrl(href) {
        return href && !href.startsWith("http://") && !href.startsWith("https://") && !href.startsWith("#") && !href.startsWith("mailto:");
      }

      function resolveRelative(currentPath, href) {
        // Resolve relative URLs against the directory of current markdown file
        const base = new URL(encodePath(currentPath), location.href);
        return new URL(href, base).pathname.replace(location.pathname.replace(/\/index\.html?$/, "/"), "");
      }

      function rewriteLinkHref(currentPath, href) {
        if (!href) return href;
        if (!isRelativeUrl(href)) return href;

        // If it links to another markdown in repo, keep it inside the reader
        if (href.endsWith(".md")) {
          // Normalize to a repo-relative path (best effort)
          const base = currentPath.split("/").slice(0, -1).join("/") + "/";
          const normalized = href.startsWith("/") ? href.replace(/^\//, "") : (base + href).replace(/^\.\//, "");
          return "#/" + normalized;
        }

        // For images/assets, try to resolve relative URL
        return href;
      }

      function rewriteImageSrc(currentPath, src) {
        if (!src) return src;
        if (!isRelativeUrl(src)) return src;
        // Keep as relative to markdown file directory so assets can load
        // (If your assets are centralized elsewhere, we can tweak this rule.)
        return src;
      }

      function installMarkedRenderer(currentPath) {
        const renderer = new marked.Renderer();

        renderer.link = (token) => {
          const href = token.href || "";
          const title = token.title ? ` title="${token.title.replace(/"/g, "&quot;")}"` : "";
          const text = token.text || href;
          const newHref = rewriteLinkHref(currentPath, href);
          const isInternal = typeof newHref === "string" && newHref.startsWith("#/");
          const attrs = isInternal ? "" : ` target="_blank" rel="noopener noreferrer"`;
          return `<a href="${newHref}"${title}${attrs}>${text}</a>`;
        };

        renderer.image = (token) => {
          const src = token.href || "";
          const alt = (token.text || "").replace(/"/g, "&quot;");
          const title = token.title ? ` title="${token.title.replace(/"/g, "&quot;")}"` : "";
          const newSrc = rewriteImageSrc(currentPath, src);
          return `<img src="${newSrc}" alt="${alt}"${title} />`;
        };

        marked.setOptions({
          gfm: true,
          breaks: false,
        });

        marked.use({ renderer });
      }

      async function loadMarkdown(path) {
        const safePath = path || DEFAULT_PATH;
        const url = encodePath(safePath);

        currentPathEl.textContent = safePath;
        btnOpenRaw.href = url;
        footerHint.textContent = "";

        installMarkedRenderer(safePath);

        mdEl.innerHTML = "<p class='hint'>載入中…</p>";
        try {
          const res = await fetch(url, { cache: "no-cache" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = await res.text();
          const rawHtml = marked.parse(text);
          const clean = DOMPurify.sanitize(rawHtml, { USE_PROFILES: { html: true } });
          mdEl.innerHTML = clean;

          // If there are hash-based internal links, keep navigation smooth.
          mdEl.querySelectorAll('a[href^="#/"]').forEach((a) => {
            a.addEventListener("click", (e) => {
              // Allow normal hash navigation; just ensure it routes.
              const href = a.getAttribute("href");
              if (href) {
                e.preventDefault();
                location.hash = href;
              }
            });
          });
        } catch (err) {
          mdEl.innerHTML = `<div class="error"><strong>載入失敗</strong><div class="hint">找不到檔案：<code>${safePath}</code><br/>錯誤：<code>${String(err)}</code></div></div>`;
          footerHint.textContent = "若這是新檔案，請確認它已推到 main，且檔名/路徑正確。";
        }
      }

      function buildNav() {
        function addItem(ul, item) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = "#/" + item.path;
          a.textContent = item.label;
          a.dataset.path = item.path;
          li.appendChild(a);
          ul.appendChild(li);
        }

        ROUTES.filter(r => r.group === "main").forEach(r => addItem(navMain, r));
        ROUTES.filter(r => r.group === "chapters").forEach(r => addItem(navChapters, r));
        ROUTES.filter(r => r.group === "other").forEach(r => addItem(navOther, r));
      }

      function highlightActive(path) {
        document.querySelectorAll("aside a[data-path]").forEach((a) => {
          const isActive = a.dataset.path === path;
          if (isActive) a.setAttribute("aria-current", "page");
          else a.removeAttribute("aria-current");
        });
      }

      function onRouteChange() {
        const path = routeFromHash();
        highlightActive(path);
        loadMarkdown(path);
      }

      buildNav();
      window.addEventListener("hashchange", onRouteChange);
      if (!location.hash) setHashToPath(DEFAULT_PATH);
      onRouteChange();
    </script>
  </body>
</html>
